name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
      actions: read # Required for Claude to read CI results on PRs
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Run Claude Code
        id: claude
        # Pinned to the stable v1 tag (carries the claude_args schema). Do NOT use
        # @main (moves under us) or @beta (old v0 schema whose default model id was
        # decommissioned, which previously broke this workflow with a 404).
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

          # Lets Claude read CI results on PRs.
          additional_permissions: |
            actions: read

          # v1 has no `model:` input — the model and session settings are passed
          # straight to the Claude Code CLI via claude_args:
          #   --model claude-opus-4-8            pins Opus 4.8 (overrides ANTHROPIC_MODEL).
          #   --settings '{"ultracode":true}'    enables ultracode for the session:
          #     xhigh per-message reasoning PLUS dynamic-workflow orchestration for
          #     substantive tasks. ultracode is a session-only Claude Code *setting*
          #     (see code.claude.com/docs/en/model-config), NOT an effort level — so
          #     it must be passed via --settings, not --effort.
          claude_args: |
            --model claude-opus-4-8
            --settings '{"ultracode":true}'

          # No `prompt:` on purpose: on a trigger-phrase (@claude) event with no
          # prompt, v1 runs in tag mode and builds the prompt from the comment.
          # Supplying `prompt` would force agent/automation mode instead.
