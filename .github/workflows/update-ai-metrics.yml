name: Weekly AI Metrics Update

on:
  # Restored 2026-08-02: the cron was disabled while GH_PAT / VERCEL_DEPLOY_HOOK were
  # missing, but this job is also the DISPATCHER for every other project repo — with it
  # off, nothing anywhere recomputed and all five sidecars silently froze for ~2 months.
  # Both secrets are now configured, so the weekly run is back on its original cadence.
  schedule:
    - cron: '0 6 * * 0'   # Sundays 06:00 UTC
  workflow_dispatch:      # allow manual trigger from Actions tab

permissions:
  contents: write

jobs:
  update-metrics:
    name: Refresh AI usage stats
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0  # full history so git rev-list --count is accurate
          token: ${{ secrets.GH_PAT }}  # push as repo admin to bypass branch protection

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Update AI metrics
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: node scripts/update-ai-metrics.js

      # always(): the step above fans out to the other project repos and exits non-zero if
      # any dispatch fails. That must stay visible, but it must NOT strand this repo's own
      # freshly-computed metrics — an unrelated remote permission error would otherwise
      # mean the weekly run never commits anything at all.
      - name: Commit and push if metrics changed
        if: always()
        run: |
          git config user.name "bilalahamad-bot"
          git config user.email "bilal.ahamad@gmail.com"
          git add ai-metrics.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: weekly AI metrics update [skip actions]"
            git push origin HEAD
          else
            echo "No changes to commit"
          fi

      - name: Trigger Vercel deployment
        if: always()
        env:
          HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          if [ -n "$HOOK" ]; then
            curl -s -X POST "$HOOK"
            echo "Vercel deploy triggered"
          else
            echo "VERCEL_DEPLOY_HOOK not set — skipping"
          fi
