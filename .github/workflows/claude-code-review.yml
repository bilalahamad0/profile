name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize]
    # Optional: Only run on specific file changes
    # paths:
    #   - "src/**/*.ts"
    #   - "src/**/*.tsx"
    #   - "src/**/*.js"
    #   - "src/**/*.jsx"

jobs:
  claude-review:
    # Optional: Filter by PR author
    # if: |
    #   github.event.pull_request.user.login == 'external-contributor' ||
    #   github.event.pull_request.user.login == 'new-developer' ||
    #   github.event.pull_request.author_association == 'FIRST_TIME_CONTRIBUTOR'

    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        # Pinned to the stable v1 tag (carries the claude_args schema). Do NOT use
        # @main (moves under us) or @beta (old v0 schema whose default model id was
        # decommissioned, which previously broke this workflow with a 404).
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

          # v1 has no `model:` input — model and session settings go through
          # claude_args (passed straight to the Claude Code CLI):
          #   --model claude-opus-4-8            pins Opus 4.8 (overrides ANTHROPIC_MODEL).
          #   --settings '{"ultracode":true}'    enables ultracode for the session:
          #     xhigh reasoning PLUS dynamic-workflow orchestration. ultracode is a
          #     session-only Claude Code *setting* (code.claude.com/docs/en/model-config),
          #     NOT an effort level — so it must be passed via --settings, not --effort.
          claude_args: |
            --model claude-opus-4-8
            --settings '{"ultracode":true}'

          # v1 renames `direct_prompt` -> `prompt` (drop-in). Supplying `prompt`
          # runs the action in automation mode, so this review fires on every PR
          # with no @claude mention required.
          prompt: |
            Please review this pull request and provide feedback on:
            - Code quality and best practices
            - Potential bugs or issues
            - Performance considerations
            - Security concerns
            - Test coverage

            Be constructive and helpful in your feedback.
